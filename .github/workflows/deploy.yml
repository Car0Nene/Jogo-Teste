name: Deploy Família Fighter PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: familia-fighter-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare app and public Supabase configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js supabase-config.js _site/
          cp -r css js assets _site/
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          config = {
              "url": os.environ.get("SUPABASE_URL", ""),
              "anonKey": os.environ.get("SUPABASE_ANON_KEY", ""),
          }
          Path("_site/supabase-config.js").write_text(
              "window.FF_SUPABASE_CONFIG = " + json.dumps(config) + ";\n", encoding="utf-8")

          sw = Path("_site/sw.js")
          sw.write_text(re.sub(r"familia-fighter-v[0-9]+",
                               "familia-fighter-" + os.environ["GITHUB_RUN_ID"],
                               sw.read_text(encoding="utf-8")), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
