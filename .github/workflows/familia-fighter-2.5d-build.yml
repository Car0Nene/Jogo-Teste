name: Família Fighter 2.5D build

on:
  push:
    branches:
      - main
      - codex/familia-fighter-2-5d
    paths:
      - 'prototype-2.5d/**'
      - '.github/workflows/familia-fighter-2.5d-build.yml'
  pull_request:
    paths:
      - 'prototype-2.5d/**'
      - '.github/workflows/familia-fighter-2.5d-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: prototype-2.5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Update Service Worker version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd ..
          bash scripts/update-sw-version.sh
      - name: Publish built app at Pages root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp -a dist/. ..
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html manifest.webmanifest assets src/assets sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Familia Fighter 2.5D to Pages root"
            git push
          fi
